<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="flex justify-center mt-7">

    <div class="shadow-xl p-6 rounded-2xl">
        <div class="flex gap-45">
            <span class="bg-green-600 text-white rounded-lg font-bold text-lg px-2 flex items-center">
                SENA CBA MOSQUERA
            </span>
            <span class="text-slate-400 text-lg">
                Reg. Biotecnologico #4092
            </span>
        </div>

        <h1 class="text-2xl text-[#13255E] font-bold mt-5">
            BioCompost Enrequecido CBA
        </h1>
        <p class="text-slate-400 text-xl font-bold">
            Sustrato organico para cultivos de la sabana de Bogota.
        </p>

        <div class="bg-gray-100 p-5 rounded-2xl mt-5 font-bold">
            <div class="flex justify-between">
                <span class="text-slate-600 text-xl">
                    Nitrogeno Organico:
                </span>
                <p class="text-2xl text-[#13255E]"> 4.5 %</p>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-600 text-xl">
                    Materia Organica:
                </span>
                <p class="text-2xl text-[#13255E]"> 62 %</p>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-600 text-xl">
                    pH Estabilizado:
                </span>
                <p class="text-2xl text-[#13255E]"> 6.8</p>
            </div>
        </div>

        <div
            class="bg-[#13255E] text-white font-bold rounded-2xl p-4 text-xl flex justify-center mt-5 hover:bg-[#13257E]">
            Solicitar Lote para Practica
        </div>



    </div>










</body>

</html>
